    <link rel="stylesheet" href="styles/navigation.css">
    <link rel="stylesheet" href="styles/contact-form.css">
    <!--scripts-->
    <script src="scripts/script.js" defer></script>
</head>

<body>

    <nav>

        <!--mobile sidebar-->
        <ul class="sidebar">

            <!--close svg icon from google fonts/icons-->
            <li onclick="hideSidebar()">
                <a href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" height="23px" viewBox="0 -960 960 960" width="23px"
                        fill="#e3e3e3">
                        <path
                            d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                    </svg>
                </a>
            </li>

            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="sign-up-form.html">Sign Up</a></li>
            <li><a href="memberships.html">Memberships</a></li>
            <li><a href="training-programmes.html">Training</a></li>
        </ul>

        <!--desktop navigation bar-->
        <ul>
            <li><a href="index.html">Home</a></li>
            <li class="hide-on-mobile"><a href="contact.html">Contact</a></li>
            <li class="hide-on-mobile"><a href="about.html">About</a></li>
            <li class="hide-on-mobile"><a href="sign-up-form.html">Sign Up</a></li>
            <li class="hide-on-mobile"><a href="memberships.html">Memberships</a></li>
            <li class="hide-on-mobile"><a href="training-programmes.html">Training</a></li>

            <!--hamburger svg from google fonts/icons-->
            <li class="hamburger-menu" onclick="showSidebar()">
                <a href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" height="23px" viewBox="0 -960 960 960" width="23px"
                        fill="#e3e3e3">
                        <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
                    </svg>
                </a>
            </li>
        </ul>
    </nav>

    <form class="contact-form" action="#" method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="user-email">Email Address</label>
            <input type="email" id="user-email" name="email" placeholder="someone@example.com" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Inquiry">
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" name="message" placeholder="Type your message here" required></textarea>
        </div>

        <button type="submit" class="cta-button">Send Message &rarr;</button>
    </form>

    <!--FOOTER-->
    <footer>
        <div class="footer-container">
            <p>&copy; 2026 Gorilla Fitness. All rights reserved.</p>
            <ul class="footer-links">
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="sign-up-form.html">Sign Up</a></li>
            </ul>
        </div>
    </footer>

</body>

</html>
